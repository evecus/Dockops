[package]
name = "dockops"
version = "0.1.0"
edition = "2021"
description = "DockOps - Docker management panel (Rust port of the Go backend)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
# "tls-rustls-no-provider" avoids aws-lc-rs (a C/CMake dependency) and lets us
# pick the pure-ish `ring` provider, which cross-compiles cleanly to musl.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
bcrypt = "0.16"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
rust-embed = { version = "8", features = ["debug-embed"] }
async-stream = "0.3"
tokio-stream = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
# build.rs only uses the standard library
